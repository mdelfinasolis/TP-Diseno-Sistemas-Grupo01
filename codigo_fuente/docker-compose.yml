services:
  postgres:
    image: postgres:16
    container_name: gestion-evaluaciones-db
    environment:
      POSTGRES_DB: gestion_evaluaciones
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # 5434 en la PC -> 5432 dentro del contenedor
      # (5432 lo usa un PostgreSQL local y 5433 otro contenedor)
      - "5434:5432"
    volumes:
      - datos-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gestion_evaluaciones"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  datos-postgres:
