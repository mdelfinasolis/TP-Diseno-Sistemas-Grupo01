server:
  port: 8080

spring:
  application:
    name: gestion-evaluaciones
  datasource:
    # Contenedor de docker-compose.yml (puerto 5434 de la PC -> 5432 del contenedor)
    url: jdbc:postgresql://localhost:5434/gestion_evaluaciones
    username: postgres
    password: postgres
  jpa:
    # El esquema lo crea esquema_gestion_evaluaciones.sql (diagrama de despliegue);
    # Hibernate solo verifica que las entidades coincidan con las tablas.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      # always: recrea las tablas y recarga los datos de prueba en cada arranque.
      # Cambiar a "never" para conservar los datos entre ejecuciones.
      mode: always
      schema-locations: classpath:esquema_gestion_evaluaciones.sql
      data-locations: classpath:data.sql
      encoding: UTF-8
  thymeleaf:
    # Las pantallas forman parte de la capa boundary
    prefix: classpath:/boundary/templates/
    suffix: .html
    encoding: UTF-8
  # CU001: LDAP de la organización. En desarrollo, servidor LDAP embebido con los consultores de prueba.
  # Para usar un LDAP real: quitar "embedded" y configurar spring.ldap.urls, base, username y password.
  ldap:
    embedded:
      base-dn: dc=consultora,dc=com
      ldif: classpath:ldap/consultores.ldif
      port: 8389

app:
  paginacion:
    filas-por-pagina: 10
  # Repositorio de configuraciones del sistema (enunciado, CU026): parámetros e instrucciones del cuestionario
  cuestionario:
    # Tiempo máximo para completar un cuestionario, desde su inicio (se copia a cada Cuestionario al crearlo)
    tiempo-maximo-minutos: 20
    # Cantidad de preguntas por bloque (paso del wizard)
    preguntas-por-bloque: 4
    # Cantidad máxima de accesos a un cuestionario EN_PROCESO
    cantidad-maxima-accesos: 3
    # Días que un cuestionario ACTIVO puede esperar a ser comenzado (desde la creación de la evaluación)
    dias-plazo-activo: 7
    # Longitud de la clave de ingreso (letras y dígitos)
    longitud-clave: 8
    instrucciones:
      encabezado: "No podrá volver atrás una vez que comience el cuestionario."
      # Ítems separados por "|"
      items: "Debe responder todas las preguntas de cada bloque antes de avanzar al siguiente paso.|Tiene un tiempo limitado para completar el cuestionario. Se mostrará una cuenta regresiva."
      pie: "Si sale antes de terminar, sus respuestas quedarán guardadas y podrá retomarlo mientras no se supere el tiempo máximo ni la cantidad máxima de accesos."
